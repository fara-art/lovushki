# Конфиг сайта «Восемь ловушек».
# Кладётся в /etc/nginx/sites-available/lovushki и включается симлинком.

# Отзывы: не больше 10 запросов в минуту с одного адреса (плюс запас 10) — подробные лимиты в feedback.py
limit_req_zone $binary_remote_addr zone=lovushki_fb:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/lovushki;
    index index.html;

    charset utf-8;

    # Сжатие: игра — один большой html, разница заметная
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Шрифты и картинки не меняются — пусть лежат в кэше браузера
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Саму игру кэшировать не надо: обновил файл — игрок сразу видит новую версию
    location /play/ {
        add_header Cache-Control "no-cache" always;
    }
    location /udar/ {
        add_header Cache-Control "no-cache" always;
    }

    # Отзывы принимает deploy/feedback.py (служба lovushki-feedback).
    # В журнал не пишем — там был бы адрес отправителя.
    location = /api/feedback {
        limit_req zone=lovushki_fb burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # адрес нужен только для кулдауна: feedback.py держит его хэш в памяти и не записывает
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/feedback/stats {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
    }
    # Все отзывы и выгрузка в Excel — только по логину и паролю (задаёт deploy/feedback-setup.sh)
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        auth_basic "Admin dannye";
        auth_basic_user_file /etc/nginx/lovushki-admin.htpasswd;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
    }

    access_log /var/log/nginx/lovushki.access.log;
    error_log  /var/log/nginx/lovushki.error.log;
}
