# Конфиг сайта «Восемь ловушек».
# Кладётся в /etc/nginx/sites-available/lovushki и включается симлинком.

# Лимиты на один адрес. В школе весь класс выходит в интернет через один адрес,
# поэтому запас большой: 30 детей разом жмут «Отправить отзыв» в конце урока.
# Отзывы: 30 в минуту плюс запас 40 — подробные лимиты в feedback.py
limit_req_zone $binary_remote_addr zone=lovushki_fb:1m rate=30r/m;
# Игры сообщают, кто играет: при создании аккаунта, в конце уровня и за сертификат
limit_req_zone $binary_remote_addr zone=lovushki_pl:1m rate=120r/m;
# Админка: не больше 30 запросов в минуту с адреса — пароль не подобрать перебором
limit_req_zone $binary_remote_addr zone=lovushki_admin:1m rate=30r/m;

# HSTS отправляем только по https: по http браузер его всё равно не принимает
map $scheme $lovushki_hsts {
    https   "max-age=15552000";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/lovushki;
    index index.html;

    charset utf-8;
    # не сообщаем версию nginx в ответах и на страницах ошибок
    server_tokens off;

    # Сжатие: игра — один большой html, разница заметная
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;
    gzip_vary on;

    # Заголовки защиты — в deploy/nginx-headers.conf. Свой add_header в location отменяет
    # общие, поэтому тот же include повторён в каждом location со своим add_header.
    include /etc/nginx/lovushki-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # Скрытые файлы (.git, .env и подобные) не отдаём, даже если они случайно попадут в папку сайта.
    # /.well-known/ оставляем: через него certbot подтверждает сертификат
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Страницы (главная, памятка, выступление) тоже не кэшируем: иначе после выкладки
    # телефон ещё долго показывает старую версию. Сюда же попадает «/» — nginx отдаёт его как /index.html
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lovushki-headers.conf;
    }

    # Шрифты и картинки не меняются — пусть лежат в кэше браузера
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/lovushki-headers.conf;
    }

    # Саму игру кэшировать не надо: обновил файл — игрок сразу видит новую версию
    location /play/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lovushki-headers.conf;
    }
    location /udar/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lovushki-headers.conf;
    }

    # Отзывы принимает deploy/feedback.py (служба lovushki-feedback).
    # В журнал не пишем — там был бы адрес отправителя.
    # У ответов службы свои заголовки защиты (см. feedback.py), здесь добавляем только HSTS.
    location = /api/feedback {
        limit_req zone=lovushki_fb burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # адрес нужен только для кулдауна: feedback.py держит его хэш в памяти и не записывает
        proxy_set_header X-Real-IP $remote_addr;
        add_header Strict-Transport-Security $lovushki_hsts always;
    }
    location = /api/feedback/stats {
        limit_req zone=lovushki_pl burst=120 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        add_header Strict-Transport-Security $lovushki_hsts always;
    }
    # «Кто играл»: игры присылают ник, ученика (если отмечено) и сколько пройдено
    location = /api/players {
        limit_req zone=lovushki_pl burst=120 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # адрес — только для суточного лимита новых аккаунтов, в файл не пишется
        proxy_set_header X-Real-IP $remote_addr;
        add_header Strict-Transport-Security $lovushki_hsts always;
    }
    # Все отзывы, список игроков и выгрузка в Excel — только по логину и паролю (задаёт deploy/feedback-setup.sh)
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        # Только через https: по обычному http пароль и фамилии учеников шли бы открытым текстом.
        # Пока замочка нет, админка закрыта — включи его: sh deploy/https.sh имя.duckdns.org
        if ($scheme != "https") {
            return 403 "Админка открывается только через https. Включи его: sh deploy/https.sh\n";
        }
        limit_req zone=lovushki_admin burst=30 nodelay;
        limit_req_status 429;
        auth_basic "Admin dannye";
        auth_basic_user_file /etc/nginx/lovushki-admin.htpasswd;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        add_header Strict-Transport-Security $lovushki_hsts always;
    }

    access_log /var/log/nginx/lovushki.access.log;
    error_log  /var/log/nginx/lovushki.error.log;
}
