# Заголовки защиты для страниц сайта «Восемь ловушек».
# Кладётся в /etc/nginx/lovushki-headers.conf (deploy/setup.sh) и подключается строкой include
# в каждом location со своим add_header: свой add_header отменяет общие, поэтому список один и здесь.

# браузер не угадывает тип файла сам
add_header X-Content-Type-Options "nosniff" always;
# сайт нельзя вставить в чужую страницу и подсунуть поверх него свои кнопки
add_header X-Frame-Options "SAMEORIGIN" always;
# чужим сайтам при переходе по ссылке уходит только имя нашего сайта, без адреса страницы
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# камера, микрофон, геолокация и прочее играм не нужны — запрещаем совсем
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), midi=(), display-capture=()" always;
# страницы грузят код, шрифты и картинки только со своего сайта и обращаются только к нему.
# 'unsafe-inline' нужен: игры — это один html-файл со встроенными скриптами и стилями.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# после первого захода по https браузер полгода ходит на сайт только по https (по http строка пустая и не отправляется)
add_header Strict-Transport-Security $lovushki_hsts always;
