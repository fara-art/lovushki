# Ссылка по адресу сервера (http://АДРЕС/) продолжает работать после включения https.
# Ставит deploy/https.sh, обновляет deploy/setup.sh. Кладётся в /etc/nginx/conf.d/lovushki-ip.conf.
# Зоны lovushki_fb и lovushki_pl и переменная $lovushki_hsts объявлены в основном конфиге (deploy/nginx.conf).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/lovushki;
    index index.html;
    charset utf-8;
    server_tokens off;

    # те же заголовки защиты, что и у сайта с замочком (deploy/nginx-headers.conf)
    include /etc/nginx/lovushki-headers.conf;

    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lovushki-headers.conf;
    }
    location /play/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lovushki-headers.conf;
    }
    location /udar/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/lovushki-headers.conf;
    }

    # Форма отзыва на главной шлёт сюда — без этого по ссылке с адресом
    # было бы «Не получилось отправить». Страницы /admin/ тут нет нарочно:
    # пароль по голому http передавать нельзя, админка — только через https.
    location = /api/feedback {
        limit_req zone=lovushki_fb burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/feedback/stats {
        limit_req zone=lovushki_pl burst=120 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
    }
    # «Кто играл»: игры присылают ник, ученика (если отмечено) и сколько пройдено
    location = /api/players {
        limit_req zone=lovushki_pl burst=120 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
